# gitleaks 配置：误报白名单。
# 本仓库迁移自多个开源音乐 API 项目，以下均为原项目公开的客户端常量
# （非私有密钥），删除会破坏功能，故加入白名单：
# - 网易云 weapi/eapi 公开 key（NeteaseCloudMusicApi 文档公开）
# - 酷狗 signer / 设备指纹公开常量（KuGouMusicApi 源码公开）
# - packages/*/vectors/：加密 golden-vector 测试向量（dummy 数据）
# - 测试文件中的 dummy key（test-api-key-12345 等）
[allowlist]
description = "公开客户端常量与测试数据（非密钥）"
paths = [
  '''packages/.*/vectors/.*''',
  '''apps/gateway/test/.*''',
  '''apps/kugou/scripts/contract-check\.mjs''',
]
